# Intégration continue : lint, construction de l'image et test de fumée
# (SQLite et PostgreSQL). Chaque mois, reconstruction sans cache avec l'image
# de base Python/Debian à jour, pour repérer tôt une casse.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: docker run --rm -v "$PWD:/mnt:ro" koalaman/shellcheck:stable docker/bin/diacamma scripts/*.sh

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [sqlite, postgresql]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Construction de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          build-args: VERSION=ci
          tags: diacamma-syndic:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test de fumée
        run: scripts/smoke-test.sh ${{ matrix.variant == 'postgresql' && '--postgresql' || '' }} diacamma-syndic:ci
