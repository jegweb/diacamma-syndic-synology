# Intégration continue : lint, construction de l'image et test de fumée
# (PostgreSQL et SQLite). Chaque mois, reconstruction sans cache avec l'image
# de base Python/Debian à jour, pour repérer tôt une casse.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: docker run --rm -v "$PWD:/mnt:ro" koalaman/shellcheck:stable docker/bin/diacamma scripts/*.sh

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # mise-a-jour : installe la dernière version publiée, puis passe à
        # l'image construite (détection de la mise à jour, instantané, migrations).
        variant: [postgresql, sqlite, mise-a-jour, mise-a-jour-sqlite]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Construction de l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          build-args: VERSION=ci
          tags: diacamma-syndic:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test de fumée
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          published="$(sed -nE 's/^ *image: *([^ :]*diacamma-syndic):.*/\1/p' docker-compose.yml | head -n 1):latest"
          case "$VARIANT" in
            sqlite) scripts/smoke-test.sh --sqlite diacamma-syndic:ci ;;
            mise-a-jour) scripts/smoke-test.sh --depuis "$published" diacamma-syndic:ci ;;
            mise-a-jour-sqlite) scripts/smoke-test.sh --sqlite --depuis "$published" diacamma-syndic:ci ;;
            *) scripts/smoke-test.sh diacamma-syndic:ci ;;
          esac
