# Intégration continue : lint, construction de l'image et test de fumée
# (Syndic et Asso, PostgreSQL et SQLite). Chaque mois, reconstruction sans
# cache avec l'image de base Python/Debian à jour, pour repérer tôt une casse.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Une file par PR (head_ref) ou par branche : l'exécution d'une PR que l'on
  # vient de fusionner ne doit pas annuler celle de main.
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: docker run --rm -v "$PWD:/mnt:ro" koalaman/shellcheck:stable docker/bin/diacamma scripts/*.sh

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # mise-a-jour : installe la dernière version publiée, puis passe à
        # l'image construite (détection de la mise à jour, instantané, migrations).
        # asso : kit Diacamma Asso (les autres variantes testent Syndic).
        variant: [postgresql, sqlite, mise-a-jour, mise-a-jour-sqlite, asso, mise-a-jour-asso]
    steps:
      - uses: actions/checkout@v7
        with:
          # Étiquettes Git : le test de mise à jour part du kit de l'ancienne version.
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - name: Construction de l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          build-args: VERSION=ci
          tags: diacamma:ci
          cache-from: type=gha
          # Cache impossible à écrire (PR déjà fusionnée…) : sans effet sur le test.
          cache-to: type=gha,mode=max,ignore-error=true
      - name: Test de fumée
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          image="$(sed -nE 's/^ *image: *([^ :]*\/diacamma):.*/\1/p' docker-compose.yml | head -n 1)"
          # Les installations Syndic existantes partent de l'alias -syndic, seul
          # nom de l'image avant 2.7.10-4 et toujours publié.
          syndic="$image-syndic:latest"
          case "$VARIANT" in
            sqlite) scripts/smoke-test.sh --sqlite diacamma:ci ;;
            mise-a-jour) scripts/smoke-test.sh --depuis "$syndic" diacamma:ci ;;
            mise-a-jour-sqlite) scripts/smoke-test.sh --sqlite --depuis "$syndic" diacamma:ci ;;
            asso) scripts/smoke-test.sh --asso diacamma:ci ;;
            mise-a-jour-asso)
              if docker pull -q "$image:latest" >/dev/null 2>&1 \
                && docker run --rm --entrypoint test "$image:latest" -e /opt/diacamma/build-id/asso; then
                scripts/smoke-test.sh --asso --depuis "$image:latest" diacamma:ci
              else
                echo "::notice::$image:latest absente ou sans Diacamma Asso : installation neuve à la place."
                scripts/smoke-test.sh --asso --sqlite diacamma:ci
              fi ;;
            *) scripts/smoke-test.sh diacamma:ci ;;
          esac
