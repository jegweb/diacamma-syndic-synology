# Publication d'une version : étiquette Git vX.Y.Z-N (ou vX.Y.Z-N-rcM pour une
# pré-version). Construit et teste l'image sur amd64 et arm64 (runners natifs),
# la publie sur ghcr.io (l'ancien nom <image>-syndic n'est plus alimenté depuis
# 2.7.10-4 : il garde ses versions pour les anciens kits),
# puis crée la Release GitHub avec un kit d'installation par application.
name: Publication

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.check.outputs.image }}
      version: ${{ steps.check.outputs.version }}
      base: ${{ steps.check.outputs.base }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - name: Cohérence de l'étiquette, des compose, du verrou et du CHANGELOG
        id: check
        run: |
          err() { echo "::error::$*"; exit 1; }
          [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)(-rc[0-9]+)?$ ]] \
            || err "Étiquette « $GITHUB_REF_NAME » invalide : attendu vX.Y.Z-N ou vX.Y.Z-N-rcM."
          upstream="${BASH_REMATCH[1]}"
          base="$upstream-${BASH_REMATCH[2]}"
          version="${GITHUB_REF_NAME#v}"
          image=""
          for f in docker-compose.yml docker-compose.sqlite.yml; do
            ref="$(sed -nE 's/^ *image: *(ghcr\.io\/[^ ]*\/diacamma:[^ ]+).*/\1/p' "$f" | head -n 1)"
            [[ "${ref##*:}" == "$base" ]] || err "$f référence « $ref » au lieu de la version $base."
            [[ -z "$image" || "$image" == "${ref%:*}" ]] || err "Les deux compose ne référencent pas la même image."
            image="${ref%:*}"
          done
          # Les deux applications sortent ensemble, avec le même numéro.
          for paquet in diacamma-syndic diacamma-asso; do
            grep -qiE "^$paquet==${upstream//./\\.}(\.|$)" requirements.lock \
              || err "requirements.lock ne contient pas $paquet $upstream."
          done
          grep -qF "## [$base]" CHANGELOG.md || err "CHANGELOG.md n'a pas d'entrée « ## [$base] »."
          prerelease=false
          [[ "$version" == "$base" ]] || prerelease=true
          {
            echo "image=$image"
            echo "version=$version"
            echo "base=$base"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Étiquettes Git : le test de mise à jour part du kit de l'ancienne version.
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      # Sans attestations : le Docker de Container Manager (version 24) reste
      # compatible avec ce qui est publié.
      - name: Construction (linux/${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          pull: true
          load: true
          provenance: false
          sbom: false
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}-${{ matrix.arch }}
      - name: Test de fumée
        run: |
          scripts/smoke-test.sh "$IMAGE:$VERSION-${{ matrix.arch }}"
          scripts/smoke-test.sh --asso "$IMAGE:$VERSION-${{ matrix.arch }}"
      - name: Test de mise à jour depuis la dernière version publiée
        run: |
          new="$IMAGE:$VERSION-${{ matrix.arch }}"
          # Dernière version publiée, avec Syndic et Asso depuis 2.7.10-4.
          scripts/smoke-test.sh --depuis "$IMAGE:latest" "$new"
          # Installations SQLite existantes ; couvre aussi les contrôles SQLite.
          scripts/smoke-test.sh --sqlite --depuis "$IMAGE:latest" "$new"
          scripts/smoke-test.sh --asso --depuis "$IMAGE:latest" "$new"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # On publie l'image testée elle-même, sous un tag propre à l'architecture.
      - name: Envoi sur ghcr.io
        run: docker push "$IMAGE:$VERSION-${{ matrix.arch }}"

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      discussions: write
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      VERSION: ${{ needs.prepare.outputs.version }}
      BASE: ${{ needs.prepare.outputs.base }}
      # Catégorie des Discussions où chaque version définitive est annoncée.
      ANNONCES: Annonces
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image multi-architecture
        run: |
          tags=(-t "$IMAGE:$VERSION")
          if [[ "$PRERELEASE" == false ]]; then
            # 2.7.9-1 publie aussi 2.7.9 et latest.
            tags+=(-t "$IMAGE:${VERSION%-*}" -t "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
      - name: Kits d'installation
        run: |
          for appli in syndic asso; do
            kit="diacamma-$appli-$VERSION"
            scripts/kit.sh "$appli" "dist/$kit" "$IMAGE:$VERSION"
            (cd "dist/$kit" && zip -X "../$kit.zip" docker-compose.yml docker-compose.sqlite.yml .env.example)
            unzip -l "dist/$kit.zip"
          done
      - name: Release GitHub
        run: |
          {
            awk -v h="## [$BASE]" 'index($0, h) == 1 { f = 1; next } f && /^## \[/ { exit } f' CHANGELOG.md
            echo
            echo "### Installation"
            echo
            echo "Téléchargez le kit de votre application ci-dessous, puis suivez le [README](https://github.com/$GITHUB_REPOSITORY#installation) :"
            echo
            echo "- Diacamma Syndic (copropriété) : \`diacamma-syndic-$VERSION.zip\` ;"
            echo "- Diacamma Asso (association) : \`diacamma-asso-$VERSION.zip\`."
            echo
            echo "Image : \`$IMAGE:$VERSION\` (amd64 et arm64)."
          } > notes.md
          flags=()
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease)
          else
            # Annonce dans les Discussions, seulement si la catégorie existe :
            # un nom erroné ne doit pas empêcher la création de la Release.
            # $o et $r sont des variables GraphQL, pas des variables shell.
            # shellcheck disable=SC2016
            categories="$(gh api graphql \
              -f query='query($o: String!, $r: String!) { repository(owner: $o, name: $r) { discussionCategories(first: 25) { nodes { name } } } }' \
              -f o="${GITHUB_REPOSITORY%/*}" -f r="${GITHUB_REPOSITORY#*/}" \
              --jq '.data.repository.discussionCategories.nodes[].name' || true)"
            if grep -qxF "$ANNONCES" <<<"$categories"; then
              flags+=(--discussion-category "$ANNONCES")
            else
              echo "::warning::Catégorie de Discussions « $ANNONCES » introuvable : pas d'annonce créée."
            fi
          fi
          gh release create "$GITHUB_REF_NAME" "dist/diacamma-syndic-$VERSION.zip" "dist/diacamma-asso-$VERSION.zip" \
            --title "Diacamma $VERSION (Syndic et Asso)" --notes-file notes.md "${flags[@]}"
