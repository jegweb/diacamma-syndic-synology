# Formulaire de la catégorie « Questions et aide » des Discussions.
# Le nom du fichier doit rester celui de la catégorie (questions-et-aide).
body:
  - type: markdown
    attributes:
      value: |
        Décrivez votre situation : quelqu'un de la communauté ou le mainteneur vous répondra.
        **Masquez votre nom de domaine, vos adresses IP publiques et tout mot de passe** (remplacez-les par `syndic.mondomaine.fr`, `x.x.x.x`, `***`).
        Pour l'utilisation de Diacamma elle-même (comptabilité, appels de fonds…), le [forum Diacamma](https://forum.diacamma.org) est plus adapté.
  - type: textarea
    id: question
    attributes:
      label: Votre question
      description: Ce que vous cherchez à faire, ce que vous avez essayé, ce qui se passe.
    validations:
      required: true
  - type: input
    id: nas
    attributes:
      label: Modèle du NAS et version de DSM
      placeholder: "ex. DS220+, DSM 7.2.2"
    validations:
      required: true
  - type: dropdown
    id: arch
    attributes:
      label: Processeur du NAS
      options:
        - Intel/AMD (x86_64)
        - ARM 64 bits (aarch64)
        - Je ne sais pas
  - type: dropdown
    id: etape
    attributes:
      label: Étape concernée
      options:
        - Installation
        - Accès HTTPS (Web Station, proxy inversé, box)
        - Mise à jour
        - Sauvegarde ou restauration
        - Autre
  - type: input
    id: version
    attributes:
      label: Version de l'image
      description: "La fin de la ligne `image:` de votre docker-compose.yml, ou la sortie de `sudo docker exec diacamma-syndic diacamma version`."
      placeholder: "ex. 2.7.10-1"
  - type: textarea
    id: journal
    attributes:
      label: Extrait du journal (facultatif)
      description: Container Manager → Conteneur → double-clic sur diacamma-syndic → onglet Journal. Les lignes `[diacamma]` suffisent souvent.
      render: text
